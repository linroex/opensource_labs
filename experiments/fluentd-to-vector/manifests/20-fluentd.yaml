apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: logpipe
data:
  fluent.conf: |
    # ---- generate test logs ----
    <source>
      @type sample
      tag test.log
      sample {"message":"hello from fluentd","svc":"demo"}
      rate 5
    </source>

    # surface fluentd's own internal state so we can see retries/errors
    <label @FLUENT_LOG>
      <match fluent.**>
        @type stdout
      </match>
    </label>

    # ---- forward to Vector's `fluent` source ----
    <match test.**>
      @type forward
      # Vector's fluent source listens on TCP only and does NOT
      # implement the UDP heartbeat. Without this line out_forward
      # defaults to UDP heartbeats that Vector never answers, so the
      # node is flapped to "unavailable" and delivery stalls.
      heartbeat_type transport

      # Vector's fluent source does not implement the forward
      # handshake / shared-key auth, so we must NOT configure a
      # <security> block here. Vector DOES support ack, so this is safe.
      require_ack_response true
      transport tcp

      <server>
        name vector
        host vector
        port 24224
      </server>

      <buffer>
        @type memory
        flush_mode interval
        flush_interval 1s
        retry_type exponential_backoff
        retry_wait 1s
      </buffer>
    </match>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluentd
  namespace: logpipe
  labels:
    app: fluentd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      containers:
        - name: fluentd
          image: fluent/fluentd:v1.17-debian-1
          env:
            - name: FLUENTD_CONF
              value: fluent.conf
          volumeMounts:
            - name: config
              mountPath: /fluentd/etc
      volumes:
        - name: config
          configMap:
            name: fluentd-config
