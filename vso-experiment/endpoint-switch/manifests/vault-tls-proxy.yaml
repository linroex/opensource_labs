apiVersion: v1
kind: ConfigMap
metadata: {name: vault-tls-nginx, namespace: vault}
data:
  default.conf: |
    server {
      listen 8443 ssl;
      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      location / {
        proxy_pass http://vault.vault.svc.cluster.local:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vault-tls, namespace: vault, labels: {app: vault-tls}}
spec:
  replicas: 1
  selector: {matchLabels: {app: vault-tls}}
  template:
    metadata: {labels: {app: vault-tls}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports: [{containerPort: 8443}]
        volumeMounts:
        - {name: conf, mountPath: /etc/nginx/conf.d}
        - {name: tls,  mountPath: /etc/nginx/tls, readOnly: true}
      volumes:
      - {name: conf, configMap: {name: vault-tls-nginx}}
      - {name: tls,  secret: {secretName: vault-tls-certs}}
---
# domain that MATCHES the cert SAN
apiVersion: v1
kind: Service
metadata: {name: vault-tls, namespace: vault}
spec:
  selector: {app: vault-tls}
  ports: [{port: 8443, targetPort: 8443}]
---
# domain that does NOT match the cert SAN (same nginx backend, same Vault)
apiVersion: v1
kind: Service
metadata: {name: vault-tls-b, namespace: vault}
spec:
  selector: {app: vault-tls}
  ports: [{port: 8443, targetPort: 8443}]
