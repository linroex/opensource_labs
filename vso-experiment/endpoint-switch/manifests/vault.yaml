apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
  labels: {app: vault}
spec:
  replicas: 1
  selector: {matchLabels: {app: vault}}
  template:
    metadata: {labels: {app: vault}}
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:1.18
        args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200", "-dev-root-token-id=root"]
        env:
        - {name: VAULT_DEV_ROOT_TOKEN_ID, value: root}
        - {name: VAULT_ADDR, value: http://127.0.0.1:8200}
        ports: [{containerPort: 8200}]
        securityContext:
          capabilities: {add: ["IPC_LOCK"]}
        readinessProbe:
          httpGet: {path: /v1/sys/health, port: 8200}
          initialDelaySeconds: 3
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: vault, namespace: vault}
spec:
  selector: {app: vault}
  ports: [{port: 8200, targetPort: 8200}]
---
apiVersion: v1
kind: Service
metadata: {name: vault-b, namespace: vault}
spec:
  selector: {app: vault}
  ports: [{port: 8200, targetPort: 8200}]
