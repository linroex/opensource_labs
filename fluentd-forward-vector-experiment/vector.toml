data_dir = "./vecdata"
[sources.in]
type = "fluent"
address = "127.0.0.1:24225"
[sinks.out]
type = "http"
inputs = ["in"]
uri = "http://127.0.0.1:8099/"
encoding.codec = "json"
batch.max_events = 1
batch.timeout_secs = 1
buffer.type = "memory"
buffer.max_events = 1
buffer.when_full = "block"
request.concurrency = 1
request.timeout_secs = 300
