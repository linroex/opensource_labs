<system>
  log_level info
</system>
<source>
  @type monitor_agent
  bind 127.0.0.1
  port 24220
</source>
<source>
  @type forward
  bind 127.0.0.1
  port 24224
</source>
<match app.**>
  @type forward
  require_ack_response false
  send_timeout 1
  heartbeat_type none
  <server>
    host 127.0.0.1
    port 24225
  </server>
  <buffer>
    @type file
    path ./buf6/forward
    chunk_limit_size 1m
    total_limit_size 40m
    flush_mode interval
    flush_interval 1s
    flush_thread_count 1
    overflow_action drop_oldest_chunk
    retry_max_times 5
  </buffer>
</match>
