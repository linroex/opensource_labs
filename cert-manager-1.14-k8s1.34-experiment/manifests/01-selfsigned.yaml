apiVersion: v1
kind: Namespace
metadata:
  name: cm-test
---
# Direct self-signed issuer
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: cm-test
spec:
  selfSigned: {}
---
# Self-signed root CA cert
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  namespace: cm-test
spec:
  isCA: true
  commonName: experiment-root-ca
  secretName: root-ca-secret
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: Issuer
---
# CA issuer chained from the self-signed root
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: ca-issuer
  namespace: cm-test
spec:
  ca:
    secretName: root-ca-secret
---
# Leaf cert from CA issuer — SHORT duration to test renewal
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: leaf-selfsigned
  namespace: cm-test
spec:
  secretName: leaf-selfsigned-secret
  commonName: app.example.test
  dnsNames:
    - app.example.test
    - api.example.test
  duration: 1h
  renewBefore: 55m   # forces renewal almost immediately -> tests renewal loop
  issuerRef:
    name: ca-issuer
    kind: Issuer
