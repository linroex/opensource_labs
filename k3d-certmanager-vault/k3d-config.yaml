apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: cm-vault
# Kubernetes 1.34.x (k3s v1.34.12)
image: rancher/k3s:v1.34.12-k3s1
servers: 1
agents: 0
kubeAPI:
  host: "127.0.0.1"
  hostPort: "6443"
options:
  k3d:
    wait: true
    timeout: "180s"
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters: [server:*]
      - arg: --disable=metrics-server
        nodeFilters: [server:*]
