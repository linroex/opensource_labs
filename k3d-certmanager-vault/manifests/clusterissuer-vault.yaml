apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
spec:
  vault:
    # In-cluster Vault service (dev mode => plain HTTP).
    server: http://vault.vault.svc.cluster.local:8200
    # Vault PKI role used to sign (see scripts/configure-vault.sh).
    path: pki/sign/example-dot-com
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager
        serviceAccountRef:
          name: vault-issuer
          # Must match the `audience` of the Vault Kubernetes-auth role.
          audiences: ["vault"]
