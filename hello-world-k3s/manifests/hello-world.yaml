apiVersion: v1
kind: Namespace
metadata:
  name: hello
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-html
  namespace: hello
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Hello from k3s</title>
      <style>
        body { font-family: system-ui, sans-serif; background: #0b1020; color: #e6e9f5;
               display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { padding: 2rem 3rem; border-radius: 16px; background: #161c34;
                box-shadow: 0 10px 40px rgba(0,0,0,.5); text-align: center; }
        h1 { margin: 0 0 .5rem; font-size: 2.2rem; }
        p  { margin: 0; opacity: .8; }
        code { background: #0b1020; padding: .1rem .4rem; border-radius: 6px; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Hello, World!</h1>
        <p>Served from nginx on <code>k3s</code>.</p>
      </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: hello
spec:
  replicas: 2
  selector:
    matchLabels: { app: hello-web }
  template:
    metadata:
      labels: { app: hello-web }
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        readinessProbe:
          httpGet: { path: /, port: 80 }
          periodSeconds: 2
      volumes:
      - name: html
        configMap:
          name: hello-html
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web
  namespace: hello
spec:
  type: NodePort
  selector: { app: hello-web }
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
